name: dashboard-e2e

on:
  pull_request:
    paths:
      - "apps/dashboard/**"
      - ".github/workflows/dashboard-e2e.yml"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm -C apps/dashboard exec playwright install --with-deps chromium

      - name: Run dashboard e2e suite
        run: pnpm -C apps/dashboard test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/dashboard/playwright-report
            apps/dashboard/test-results
          retention-days: 7
